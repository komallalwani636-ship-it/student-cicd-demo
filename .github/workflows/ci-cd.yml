name: Student Grade CI-CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test:
    name: CI - Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Tests
        run: |
          pytest

  deploy:
    name: CD - Deploy Application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Student Grade Application deployed successfully!"
          echo "Grade and scholarship eligibility system is ready."
